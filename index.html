<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granny Square — Combinazioni Colori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe7; --bg2:#efe8dd;
    --panel:#fffdf9; --panel-2:#fbf6ee;
    --ink:#3a322a; --ink-soft:#6b6055; --muted:#9a8f80;
    --line:#e4dccb; --line-soft:#ece4d6;
    --accent:#a8543a; --accent-soft:#c97a5b; --accent-ink:#fff7ef;
    --ok:#5f7a4e; --ok-soft:#eef3e9;
    --gold:#b08a4a;
    --shadow:0 1px 2px rgba(58,50,42,.05),0 8px 24px -16px rgba(58,50,42,.18);
    --shadow-lift:0 2px 6px rgba(58,50,42,.08),0 14px 34px -18px rgba(58,50,42,.28);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Fraunces",Georgia,"Times New Roman",serif;
    background:radial-gradient(1200px 600px at 80% -10%,#fff8ee 0,transparent 60%),var(--bg);
    color:var(--ink);line-height:1.5;
    font-optical-sizing:auto;font-variation-settings:"opsz" 14,"SOFT" 50;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--accent-ink)}

  header{
    padding:26px 30px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border-bottom:1px solid var(--line);box-shadow:var(--shadow);
    display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;
  }
  header h1{margin:0;font-size:30px;font-weight:500;letter-spacing:.2px;
    font-variation-settings:"opsz" 60,"SOFT" 100;font-style:italic}
  header h1 .amp{color:var(--accent);font-style:italic}
  header .row-actions{display:flex;gap:8px;align-items:center}

  main{display:grid;grid-template-columns:330px 1fr;gap:22px;padding:24px;max-width:1440px;margin:0 auto;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}

  #leftPanel{position:sticky;top:24px}
  @media(max-width:900px){#leftPanel{position:static;top:auto}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow)}
  .panel h2{margin:0 0 16px;font-size:20px;font-weight:400;letter-spacing:.4px;
    font-style:italic;color:var(--ink);position:relative}
  .panel h2::after{content:"";display:block;width:34px;height:2px;background:var(--accent);
    margin-top:8px;border-radius:2px;opacity:.7}
  .panel h2 .count{font-style:normal;font-size:13px;color:var(--muted);margin-left:6px;font-weight:300}

  /* Color editor */
  .color-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .color-row:last-child{border-bottom:none}
  .swatch{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);flex:none;
    cursor:pointer;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  .swatch input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;border:none;padding:0}
  .cname{flex:1;min-width:0;border:none;background:transparent;font-family:inherit;font-size:17px;
    color:var(--ink);border-bottom:1px solid transparent;font-weight:400;letter-spacing:.2px}
  .cname:focus{outline:none;border-bottom-color:var(--accent)}
  .crgb{font-size:11px;color:var(--muted);width:84px;text-align:center;letter-spacing:.5px;
    font-feature-settings:"tnum"}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:14px;
    font-weight:400;letter-spacing:.2px;transition:.15s}
  .btn:hover{background:var(--panel-2);border-color:var(--accent-soft)}
  .btn.primary{background:linear-gradient(180deg,var(--accent-soft),var(--accent));
    color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 8px -3px rgba(168,84,58,.5)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .toggle{width:46px;height:24px;border-radius:24px;background:#d8cfbe;position:relative;
    cursor:pointer;flex:none;transition:.18s;border:1px solid var(--line)}
  .toggle.on{background:var(--ok);border-color:var(--ok)}
  .toggle::after{content:"";position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle.on::after{left:23px}
  .row-actions{display:flex;gap:6px;align-items:center}
  .add-color{margin-top:16px;gap:8px}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:14px;font-weight:300;line-height:1.6;
    border-top:1px solid var(--line-soft);padding-top:12px}

  /* Stats / filters */
  .stats{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  #counter{font-size:14px;color:var(--ink-soft);font-weight:300;letter-spacing:.2px}
  #counter b{font-weight:500;color:var(--ink);font-style:italic}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters .btn.active{background:linear-gradient(180deg,var(--accent-soft),var(--accent));
    color:var(--accent-ink);border-color:var(--accent)}
  .filters .btn.active:hover{filter:brightness(1.05)}
  select.psize{font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer}
  select.psize:focus{outline:none;border-color:var(--accent)}
  .plabel{font-size:13px;color:var(--muted);font-weight:300;letter-spacing:.2px}

  /* Combinations grid */
  #comboWrap{margin-top:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .square{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--panel);
    cursor:pointer;transition:.18s;position:relative;display:flex;flex-direction:column;align-items:center}
  .square:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);border-color:var(--accent-soft)}
  .square.done{border-color:var(--ok);background:linear-gradient(180deg,var(--ok-soft),var(--panel))}
  .square.done .badge{opacity:1;transform:scale(1)}
  .square .label{font-size:13px;margin-top:10px;color:var(--muted);text-align:center;font-style:italic;font-weight:300}
  .square.done .label{color:var(--ok);font-weight:500}
  .square .badge{position:absolute;top:10px;right:10px;font-size:15px;color:var(--ok);
    opacity:0;transform:scale(.6);transition:.18s}

  /* Concentric granny square */
  .granny{position:relative;display:flex;align-items:center;justify-content:center}
  .ring{position:relative;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .gnum{position:absolute;top:1px;left:50%;transform:translateX(-50%);
    font-size:8px;font-weight:600;letter-spacing:.3px;font-family:"Fraunces",serif;
    font-feature-settings:"tnum";pointer-events:none;text-shadow:0 1px 1px rgba(0,0,0,.15)}

  /* pagination */
  .pager{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
  .pager .info{font-size:13px;color:var(--muted);font-weight:300;letter-spacing:.2px}
  .empty{text-align:center;color:var(--muted);padding:48px 10px;font-style:italic;font-weight:300}

  /* completed section */
  #completedSec{margin-top:28px;border-top:1px solid var(--line-soft);padding-top:20px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:24px;
    padding:6px 12px 6px 6px;background:var(--panel);box-shadow:var(--shadow);font-size:13px}
  .chip:hover{border-color:var(--accent-soft)}
  .chip .x{cursor:pointer;color:var(--muted);font-weight:400;font-size:15px;line-height:1}
  .chip .x:hover{color:var(--accent)}
  .chip .mini .ring{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .chip .miss{font-size:11px;color:var(--muted);font-style:italic}

  /* footer note */
  .foot{max-width:1440px;margin:0 auto;padding:0 24px 32px;color:var(--muted);
    font-size:12px;font-weight:300;letter-spacing:.3px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Granny Square <span class="amp">·</span> Combinazioni</h1>
  </div>
  <div class="row-actions">
    <button class="btn" id="resetBtn" title="Azzera tutto (colori e completati)">Azzera dati</button>
  </div>
</header>

<main>
  <section class="panel" id="leftPanel">
    <h2>Colori</h2>
    <div id="colorList"></div>
    <div class="add-color row-actions">
      <button class="btn primary sm" id="addBtn">+ Aggiungi colore</button>
      <button class="btn sm" id="randomBtn">Random</button>
    </div>
    <p class="hint">Il numero di giri equivale al numero di colori attivi. Disattiva un colore per ridurre i giri di uno: le combinazioni si ricalcolano, ma i granny square già completati restano salvati.</p>
  </section>

  <section class="panel">
    <div class="stats">
      <div id="counter"></div>
      <div class="controls">
        <div class="filters">
          <button class="btn sm filter" data-f="all">Tutte</button>
          <button class="btn sm filter" data-f="todo">Da fare</button>
          <button class="btn sm filter" data-f="done">Completate</button>
        </div>
        <span class="plabel">per pagina</span>
        <select class="psize" id="pageSize" title="Combinazioni per pagina">
          <option value="24">24</option>
          <option value="48">48</option>
          <option value="120" selected>120</option>
          <option value="240">240</option>
          <option value="500">500</option>
        </select>
      </div>
    </div>
    <div id="comboWrap">
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </div>

    <div id="completedSec">
      <h2>Completati salvati <span class="count">anche con colori disattivati</span></h2>
      <div id="completedChips" class="chips"></div>
    </div>
  </section>
</main>

<script>
"use strict";
const STORE_KEY = "grannySquares.v1";
let PAGE_SIZE = 120;

const state = {
  colors: [],
  done: {},
  filter: "all",
  page: 0,
};

let uid = 1;
function nextId(){ return "c"+(uid++); }

// ---------- persistence ----------
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state.colors = d.colors || [];
      state.done = d.done || {};
      uid = d.uid || (state.colors.reduce((m,c)=>Math.max(m,parseInt((c.id||"c1").slice(1))||1),1)+1);
      return;
    }
  }catch(e){ console.warn("load failed", e); }
  seed();
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify({colors:state.colors, done:state.done, uid}));
}
function seed(){
  const palette = [
    {name:"Bordeaux", rgb:[150,40,50]},
    {name:"Zafferano", rgb:[214,150,40]},
    {name:"Crema",    rgb:[238,222,188]},
    {name:"Salvia",   rgb:[120,158,110]},
    {name:"Lago",     rgb:[86,128,150]},
    {name:"Prugna",   rgb:[120,78,120]},
  ];
  state.colors = palette.map(p=>({id:nextId(),name:p.name,r:p.rgb[0],g:p.rgb[1],b:p.rgb[2],enabled:true}));
  save();
}

// ---------- helpers ----------
const active = ()=> state.colors.filter(c=>c.enabled);
const hex = c=>"#"+[c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,"0")).join("");
const fromHex = h=>{ h=h.replace("#",""); return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}; };
const lum = c=>(0.299*c.r+0.587*c.g+0.114*c.b);
const contrast = c=> lum(c)>140 ? "rgba(0,0,0,.62)" : "rgba(255,255,255,.92)";
const keyOf = arr=> arr.map(c=>c.id).join("|");

// ---------- permutations (Heap's algorithm) ----------
function permutations(arr){
  const out=[];
  const n=arr.length;
  if(n===0) return [[]];
  if(n>10){ return null; }
  const a=arr.slice();
  const c=new Array(n).fill(0);
  out.push(a.slice());
  let i=1;
  while(i<n){
    if(c[i]<i){
      if(i%2===0){ [a[0],a[i]]=[a[i],a[0]]; } else { [a[c[i]],a[i]]=[a[i],a[c[i]]]; }
      out.push(a.slice());
      c[i]++; i=1;
    } else { c[i]=0; i++; }
    if(out.length>500000){ return out; }
  }
  return out;
}

// ---------- concentric granny square HTML ----------
// perm[0] = outermost ring (giro 1), last = center.
function grannyHtml(perm, size){
  const n=perm.length;
  if(n===0) return "";
  const S=size;
  const t=S/(2*n);                 // band thickness
  let inner="";
  for(let k=n-1;k>=0;k--){
    const col=perm[k];
    const side=Math.max(S - 2*k*t, 2);
    const label = t>=8.5 ? `<span class="gnum" style="color:${contrast(col)}">${k+1}</span>` : "";
    inner = `<div class="ring" style="width:${side.toFixed(1)}px;height:${side.toFixed(1)}px;background:${hex(col)}">${label}${inner}</div>`;
  }
  return `<div class="granny" style="width:${S}px;height:${S}px">${inner}</div>`;
}

// ---------- render colors ----------
function renderColors(){
  const list=document.getElementById("colorList");
  list.innerHTML="";
  state.colors.forEach((c,idx)=>{
    const row=document.createElement("div");
    row.className="color-row";
    row.innerHTML=`
      <label class="swatch" style="background:${hex(c)}">
        <input type="color" value="${hex(c)}" data-i="${idx}" data-act="color">
      </label>
      <input class="cname" value="${c.name.replace(/"/g,'&quot;')}" data-i="${idx}" data-act="name" placeholder="Nome">
      <span class="crgb">${c.r},${c.g},${c.b}</span>
      <div class="row-actions">
        <div class="toggle ${c.enabled?'on':''}" data-i="${idx}" data-act="toggle" title="Attiva/disattiva"></div>
        <button class="btn sm" data-i="${idx}" data-act="del" title="Elimina">✕</button>
      </div>`;
    list.appendChild(row);
  });
}

// ---------- render combinations ----------
let allCombos=null;
function renderCombos(){
  const grid=document.getElementById("grid");
  const pager=document.getElementById("pager");
  const counter=document.getElementById("counter");
  const A=active();
  const n=A.length;

  if(n===0){
    allCombos=null;
    grid.innerHTML=`<div class="empty">Nessun colore attivo. Attiva almeno un colore per vedere le combinazioni.</div>`;
    pager.innerHTML="";
    counter.textContent="";
    renderCompleted();
    return;
  }

  allCombos=permutations(A);
  if(allCombos===null){
    grid.innerHTML=`<div class="empty">Troppi colori attivi (max 10) per generare tutte le permutazioni.</div>`;
    pager.innerHTML=""; counter.textContent="";
    renderCompleted(); return;
  }

  let combos=allCombos;
  if(state.filter==="done") combos=combos.filter(p=>state.done[keyOf(p)]);
  else if(state.filter==="todo") combos=combos.filter(p=>!state.done[keyOf(p)]);

  const total=allCombos.length;
  const doneCount=allCombos.filter(p=>state.done[keyOf(p)]).length;
  counter.innerHTML=`<b>${n}</b> colori attivi → <b>${n}</b> giri · <b>${total.toLocaleString("it-IT")}</b> combinazioni · <b>${doneCount}</b> completate`;

  const pages=Math.ceil(combos.length/PAGE_SIZE)||1;
  if(state.page>=pages) state.page=pages-1;
  if(state.page<0) state.page=0;
  const start=state.page*PAGE_SIZE;
  const slice=combos.slice(start,start+PAGE_SIZE);

  const ringSize = n<=4?150: n<=6?140:128;

  grid.innerHTML="";
  const frag=document.createDocumentFragment();
  slice.forEach(perm=>{
    const key=keyOf(perm);
    const isDone=!!state.done[key];
    const sq=document.createElement("div");
    sq.className="square"+(isDone?" done":"");
    sq.dataset.key=key;
    sq.innerHTML=
      grannyHtml(perm, ringSize) +
      `<div class="label">${isDone?"✓ Completato":"Segna completato"}</div>` +
      `<div class="badge">✓</div>`;
    sq.addEventListener("click",()=>{
      if(state.done[key]) delete state.done[key]; else state.done[key]=true;
      save();
      renderCombos();
    });
    frag.appendChild(sq);
  });
  grid.appendChild(frag);

  pager.innerHTML="";
  if(pages>1){
    const prev=document.createElement("button");
    prev.className="btn sm"; prev.textContent="‹"; prev.disabled=state.page===0;
    prev.onclick=()=>{state.page--;renderCombos();};
    pager.appendChild(prev);
    const info=document.createElement("span");
    info.className="info";
    info.textContent=`${state.page+1} / ${pages}  ·  pagina ${start+1}–${Math.min(start+PAGE_SIZE,combos.length)} di ${combos.length}`;
    pager.appendChild(info);
    const next=document.createElement("button");
    next.className="btn sm"; next.textContent="›"; next.disabled=state.page===pages-1;
    next.onclick=()=>{state.page++;renderCombos();};
    pager.appendChild(next);
  }

  renderCompleted();
}

// ---------- completed chips (all saved, regardless of disabled) ----------
function renderCompleted(){
  const wrap=document.getElementById("completedChips");
  const keys=Object.keys(state.done);
  if(keys.length===0){
    wrap.innerHTML=`<span style="color:var(--muted);font-style:italic;font-weight:300;font-size:14px">Nessun granny square completato ancora.</span>`;
    return;
  }
  const byId=new Map(state.colors.map(c=>[c.id,c]));
  wrap.innerHTML="";
  const frag=document.createDocumentFragment();
  keys.forEach(key=>{
    const ids=key.split("|");
    const cols=ids.map(id=>byId.get(id)).filter(Boolean);
    const missing=ids.length-cols.length;
    const chip=document.createElement("div");
    chip.className="chip";
    let mini="";
    if(cols.length){
      mini=`<span class="mini">${grannyHtml(cols,30)}</span>`;
    }
    const miss = missing ? `<span class="miss">+${missing} disatt.</span>` : "";
    chip.innerHTML=`${mini}${miss}<span class="x" data-key="${key}" title="Rimuovi dai completati">✕</span>`;
    frag.appendChild(chip);
  });
  wrap.appendChild(frag);
}

// ---------- events ----------
document.getElementById("colorList").addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t) return;
  const i=+t.dataset.i;
  const act=t.dataset.act;
  if(act==="toggle"){
    state.colors[i].enabled=!state.colors[i].enabled;
    save(); renderColors(); state.page=0; renderCombos();
  } else if(act==="del"){
    if(!confirm("Eliminare questo colore? I granny square già completati con questo colore restano salvati.")) return;
    state.colors.splice(i,1);
    save(); renderColors(); state.page=0; renderCombos();
  }
});
document.getElementById("colorList").addEventListener("input",e=>{
  const t=e.target.closest("[data-act]");
  if(!t) return;
  const i=+t.dataset.i;
  if(t.dataset.act==="color"){
    const {r,g,b}=fromHex(t.value);
    Object.assign(state.colors[i],{r,g,b});
    t.closest(".swatch").style.background=t.value;
    const rgb=t.closest(".color-row").querySelector(".crgb");
    rgb.textContent=`${r},${g},${b}`;
    save(); renderCombos();
  } else if(t.dataset.act==="name"){
    state.colors[i].name=t.value;
    save();
  }
});
document.getElementById("addBtn").addEventListener("click",()=>{
  state.colors.push({id:nextId(),name:"Colore "+(state.colors.length+1),r:130,g:120,b:110,enabled:true});
  save(); renderColors(); state.page=0; renderCombos();
});
document.getElementById("randomBtn").addEventListener("click",()=>{
  if(state.colors.length===0) return;
  const last=state.colors[state.colors.length-1];
  last.r=Math.floor(Math.random()*256); last.g=Math.floor(Math.random()*256); last.b=Math.floor(Math.random()*256);
  save(); renderColors(); renderCombos();
});
document.getElementById("completedChips").addEventListener("click",e=>{
  const x=e.target.closest(".x");
  if(!x) return;
  delete state.done[x.dataset.key];
  save(); renderCombos();
});
document.querySelectorAll(".filter").forEach(b=>{
  b.addEventListener("click",()=>{
    state.filter=b.dataset.f;
    document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));
    state.page=0; renderCombos();
  });
});
document.getElementById("pageSize").addEventListener("change",e=>{
  PAGE_SIZE=+e.target.value;
  state.page=0; renderCombos();
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Azzerare TUTTO (colori e completati)?")) return;
  localStorage.removeItem(STORE_KEY);
  state.colors=[]; state.done={}; uid=1; seed();
  state.page=0; state.filter="all";
  document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.f==="all"));
  renderColors(); renderCombos();
});

// ---------- init ----------
load();
document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.f==="all"));
renderColors();
renderCombos();
</script>
</body>
</html>
