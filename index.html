<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granny Square — Combinazioni Colori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe7; --bg2:#efe8dd;
    --panel:#fffdf9; --panel-2:#fbf6ee;
    --ink:#3a322a; --ink-soft:#6b6055; --muted:#9a8f80;
    --line:#e4dccb; --line-soft:#ece4d6;
    --accent:#a8543a; --accent-soft:#c97a5b; --accent-ink:#fff7ef;
    --ok:#5f7a4e; --ok-soft:#eef3e9;
    --gold:#b08a4a;
    --shadow:0 1px 2px rgba(58,50,42,.05),0 8px 24px -16px rgba(58,50,42,.18);
    --shadow-lift:0 2px 6px rgba(58,50,42,.08),0 14px 34px -18px rgba(58,50,42,.28);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Fraunces",Georgia,"Times New Roman",serif;
    background:radial-gradient(1200px 600px at 80% -10%,#fff8ee 0,transparent 60%),var(--bg);
    color:var(--ink);line-height:1.5;
    font-optical-sizing:auto;font-variation-settings:"opsz" 14,"SOFT" 50;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--accent-ink)}

  header{
    padding:26px 30px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border-bottom:1px solid var(--line);box-shadow:var(--shadow);
    display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;
  }
  header h1{margin:0;font-size:30px;font-weight:500;letter-spacing:.2px;
    font-variation-settings:"opsz" 60,"SOFT" 100;font-style:italic}
  header h1 .amp{color:var(--accent);font-style:italic}
  header .row-actions{display:flex;gap:8px;align-items:center}
  .cloud-dot{width:9px;height:9px;border-radius:50%;background:#cfc4b0;border:1px solid var(--line);display:inline-block;flex:none}
  .cloud-dot.on{background:var(--ok);border-color:var(--ok)}
  .cloud-dot.err{background:var(--accent);border-color:var(--accent)}
  .cloud-btn{display:flex;align-items:center;gap:7px}
  .lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .lang-switch button{border:none;background:var(--panel);color:var(--ink-soft);font-family:inherit;
    font-size:13px;font-weight:500;letter-spacing:.3px;padding:7px 10px;cursor:pointer;transition:.15s}
  .lang-switch button+button{border-left:1px solid var(--line)}
  .lang-switch button.active{background:linear-gradient(180deg,var(--accent-soft),var(--accent));color:var(--accent-ink)}

  main{display:grid;grid-template-columns:330px 1fr;gap:22px;padding:24px;max-width:1440px;margin:0 auto;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}

  #leftPanel{position:sticky;top:24px}
  @media(max-width:900px){#leftPanel{position:static;top:auto}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);min-width:0}
  .panel h2{margin:0 0 16px;font-size:20px;font-weight:400;letter-spacing:.4px;
    font-style:italic;color:var(--ink);position:relative}
  .panel h2::after{content:"";display:block;width:34px;height:2px;background:var(--accent);
    margin-top:8px;border-radius:2px;opacity:.7}
  .panel h2 .count{font-style:normal;font-size:13px;color:var(--muted);margin-left:6px;font-weight:300}

  /* Color editor */
  .color-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .color-row:last-child{border-bottom:none}
  .swatch{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);flex:none;
    cursor:pointer;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  .swatch input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;border:none;padding:0}
  .cname{flex:1;min-width:0;border:none;background:transparent;font-family:inherit;font-size:17px;
    color:var(--ink);border-bottom:1px solid transparent;font-weight:400;letter-spacing:.2px}
  .cname:focus{outline:none;border-bottom-color:var(--accent)}
  .cname-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .crgb{font-size:11px;color:var(--muted);letter-spacing:.5px;font-feature-settings:"tnum"}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:14px;
    font-weight:400;letter-spacing:.2px;transition:.15s}
  .btn:hover{background:var(--panel-2);border-color:var(--accent-soft)}
  .btn.primary{background:linear-gradient(180deg,var(--accent-soft),var(--accent));
    color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 8px -3px rgba(168,84,58,.5)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .toggle{width:46px;height:24px;border-radius:24px;background:#d8cfbe;position:relative;
    cursor:pointer;flex:none;transition:.18s;border:1px solid var(--line);--tc:#999}
  .toggle.on{background:var(--tc);border-color:var(--tc)}
  .toggle::after{content:"";position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle.on::after{left:23px}
  .row-actions{display:flex;gap:6px;align-items:center}
  .add-color{margin-top:16px;gap:8px}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:14px;font-weight:300;line-height:1.6;
    border-top:1px solid var(--line-soft);padding-top:12px}

  /* Stats / filters */
  .stats{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  #counter{font-size:14px;color:var(--ink-soft);font-weight:300;letter-spacing:.2px}
  #counter b{font-weight:500;color:var(--ink);font-style:italic}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters .btn.active{background:linear-gradient(180deg,var(--accent-soft),var(--accent));
    color:var(--accent-ink);border-color:var(--accent)}
  .filters .btn.active:hover{filter:brightness(1.05)}
  select.psize{font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer}
  select.psize:focus{outline:none;border-color:var(--accent)}
  .plabel{font-size:13px;color:var(--muted);font-weight:300;letter-spacing:.2px}

  /* cloud modal */
  .overlay{position:fixed;inset:0;background:rgba(40,34,28,.45);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;
    width:min(440px,100%);box-shadow:var(--shadow-lift)}
  .modal h2{margin:0 0 6px;font-size:22px;font-weight:400;font-style:italic}
  .modal .desc{color:var(--ink-soft);font-size:13px;font-weight:300;margin:0 0 18px;line-height:1.6}
  .modal label{display:block;font-size:13px;color:var(--ink-soft);margin:12px 0 4px;font-weight:400}
  .modal input[type=text],.modal input[type=password]{width:100%;border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel-2)}
  .modal input:focus{outline:none;border-color:var(--accent)}
  .modal .mrow{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .modal .mlink{display:block;margin-top:12px;font-size:12px;color:var(--accent);text-decoration:none}
  .modal .mlink:hover{text-decoration:underline}
  .modal .status{font-size:12px;color:var(--muted);margin-top:10px;font-weight:300;min-height:14px}
  .modal .status.ok{color:var(--ok)} .modal .status.err{color:var(--accent)}

  /* Combinations grid */
  #comboWrap{margin-top:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .square{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--panel);
    cursor:pointer;transition:.18s;position:relative;display:flex;flex-direction:column;align-items:center}
  .square:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);border-color:var(--accent-soft)}
  .square.done{border-color:var(--ok);background:linear-gradient(180deg,var(--ok-soft),var(--panel))}
  .square.done .badge{opacity:1;transform:scale(1)}
  .square .label{font-size:13px;margin-top:10px;color:var(--muted);text-align:center;font-style:italic;font-weight:300}
  .square.done .label{color:var(--ok);font-weight:500}
  .square .badge{position:absolute;top:10px;right:10px;font-size:15px;color:var(--ok);
    opacity:0;transform:scale(.6);transition:.18s}

  /* Concentric granny square (fluid, scales to container) */
  .granny{position:relative;width:100%;aspect-ratio:1/1;margin:0 auto}
  .granny .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    aspect-ratio:1/1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}

  /* pagination */
  .pager{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
  .pager .info{font-size:13px;color:var(--muted);font-weight:300;letter-spacing:.2px}
  .empty{text-align:center;color:var(--muted);padding:48px 10px;font-style:italic;font-weight:300}

  /* mobile tweaks (desktop unchanged) */
  @media(max-width:900px){
    header{padding:18px 16px;gap:10px;align-items:flex-start}
    header h1{font-size:24px}
    main{padding:14px;gap:14px}
    .panel{padding:16px}
    .panel h2{font-size:18px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .square{padding:11px}
    .square .label{font-size:12px}
    .controls{gap:10px}
    .plabel{display:none}
    .pager .info{font-size:12px}
  }
  @media(max-width:560px){
    header{flex-direction:row;flex-wrap:wrap;align-items:center}
    header h1{font-size:21px;flex:1 1 100%}
    header .row-actions{flex:1 1 auto;justify-content:flex-end}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .modal{padding:20px}
    .color-row{gap:8px}
    .crgb{font-size:10px}
    .stats{gap:10px}
    #counter{flex:1 1 100%;font-size:13px}
    .controls{width:100%;justify-content:space-between}
    select.psize{padding:8px 10px;font-size:14px}
    .btn.sm{padding:8px 11px;font-size:14px}
    .toggle{width:50px;height:28px}
    .toggle::after{width:22px;height:22px}
    .toggle.on::after{left:26px}
    .square{padding:9px}
  }
  @media(max-width:380px){
    .grid{grid-template-columns:1fr}
  }
  /* tap targets: larger touch areas on small screens */
  @media(hover:none) and (pointer:coarse){
    .btn,.toggle,.square,.swatch{touch-action:manipulation}
    .square:hover{transform:none;box-shadow:var(--shadow)}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Granny Square <span class="amp">·</span> Combinazioni</h1>
  </div>
  <div class="row-actions">
    <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
      <button type="button" data-lang="it">IT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button class="btn cloud-btn" id="cloudBtn" data-i18n-title="cloudTitle">
      <span class="cloud-dot" id="cloudDot"></span> <span data-i18n="cloud">Cloud</span>
    </button>
    <button class="btn" id="resetBtn" data-i18n="reset" data-i18n-title="resetTitle"></button>
  </div>
</header>

<main>
  <section class="panel" id="leftPanel">
    <h2 data-i18n="colors"></h2>
    <div id="colorList"></div>
    <div class="add-color row-actions">
      <button class="btn primary sm" id="addBtn" data-i18n="addColor"></button>
      <button class="btn sm" id="randomBtn" data-i18n="random"></button>
    </div>
    <p class="hint" data-i18n="hint"></p>
  </section>

  <section class="panel">
    <div class="stats">
      <div id="counter"></div>
      <div class="controls">
        <div class="filters">
          <button class="btn sm filter" data-f="all" data-i18n="fAll"></button>
          <button class="btn sm filter" data-f="todo" data-i18n="fTodo"></button>
          <button class="btn sm filter" data-f="done" data-i18n="fDone"></button>
        </div>
        <span class="plabel" data-i18n="perPage"></span>
        <select class="psize" id="pageSize" data-i18n-title="pageSizeTitle">
          <option value="24">24</option>
          <option value="48">48</option>
          <option value="120" selected>120</option>
          <option value="240">240</option>
          <option value="500">500</option>
        </select>
      </div>
    </div>
    <div id="comboWrap">
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>
</main>

<div class="overlay" id="cloudOverlay">
  <div class="modal">
    <h2 data-i18n="cloudTitleModal"></h2>
    <p class="desc" data-i18n="cloudDesc"></p>
    <label for="sbUrl" data-i18n="sbUrlLabel"></label>
    <input type="text" id="sbUrl" placeholder="https://xxxxxxxx.supabase.co" autocomplete="off">
    <label for="sbKey" data-i18n="sbKeyLabel"></label>
    <input type="password" id="sbKey" placeholder="eyJhbGciOi..." autocomplete="off">
    <div class="status" id="cloudStatus"></div>
    <div class="mrow">
      <button class="btn primary sm" id="cloudSave" data-i18n="cloudSave"></button>
      <button class="btn sm" id="cloudTest" data-i18n="cloudTest"></button>
      <button class="btn sm" id="cloudClear" data-i18n="cloudClear"></button>
      <button class="btn sm" id="cloudClose" data-i18n="cloudClose"></button>
    </div>
    <a class="mlink" href="https://supabase.com/dashboard" target="_blank" rel="noopener" data-i18n="cloudCreateLink"></a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const STORE_KEY = "grannySquares.v1";
const LANG_KEY = "grannySquares.lang";
let PAGE_SIZE = 120;

// ---------- i18n ----------
let LANG = localStorage.getItem(LANG_KEY) || "it";
const I18N = {
  it:{
    colors:"Colori", addColor:"+ Aggiungi colore", random:"Random",
    hint:"Il numero di giri equivale al numero di colori attivi. Disattiva un colore per ridurre i giri di uno: le combinazioni si ricalcolano, ma i granny square già completati restano salvati.",
    fAll:"Tutti", fTodo:"Da fare", fDone:"Completati", perPage:"per pagina", pageSizeTitle:"Combinazioni per pagina",
    counter:(n,total,done)=>`<b>${n}</b> colori attivi → <b>${n}</b> giri · <b>${total}</b> combinazioni · <b>${done}</b> completate`,
    pageOf:(cur,pages,start,end,len)=>`${cur} / ${pages}  ·  pagina ${start}–${end} di ${len}`,
    doneLabel:"✓ Completato", markDone:"Segna completato",
    emptyActive:"Nessun colore attivo. Attiva almeno un colore per vedere le combinazioni.",
    emptyTooMany:"Troppi colori attivi (max 10) per generare tutte le permutazioni.",
    doneCount:"completati",
    noneCompleted:"Nessun granny square completato ancora.",
    namePlaceholder:"Nome",
    toggleTitle:"Attiva/disattiva", delTitle:"Elimina", delColor:"Eliminare questo colore? I granny square già completati con questo colore restano salvati.",
    newColor:(n)=>"Colore "+n,
    reset:"Azzera dati", resetTitle:"Azzera tutto (colori e completati)", resetConfirm:"Azzerare TUTTO (colori e completati)?",
    cloud:"Cloud", cloudTitle:"Sincronizzazione cloud Supabase",
    cloudTitleModal:"Sincronizzazione cloud", cloudDesc:"Salva colori e granny square completati su Supabase: restano permanenti e sincronizzati tra dispositivi. Le credenziali restano solo in questo browser.",
    sbUrlLabel:"Project URL", sbKeyLabel:"Publishable / anon key",
    cloudSave:"Connetti e sincronizza", cloudTest:"Solo prova", cloudClear:"Disconnetti", cloudClose:"Chiudi",
    cloudCreateLink:"Crea un progetto su supabase.com →",
    cloudConnected:"Connesso.", cloudDisconnected:"Disconnesso. I dati restano salvati solo in questo browser.",
    cloudTesting:"Provo la connessione…",
    cloudOkFound:"Connessione riuscita (trovato stato remoto).", cloudOkEmpty:"Connessione riuscita (tabella vuota: la prima sincronizzazione creerà il record).",
    cloudFail:"Connessione fallita. Controlla URL, anon key e di aver eseguito lo script SQL (vedi istruzioni).",
    cloudEnter:"Inserisci URL e anon key.", cloudConnecting:"Connessione in corso…", cloudSyncing:"Sincronizzo…",
    cloudSynced:"Sincronizzato. Dati permanenti e condivisi tra dispositivi.",
    cloudFail2:"Connessione fallita. Controlla URL, anon key e di aver eseguito lo script SQL.",
  },
  en:{
    colors:"Colors", addColor:"+ Add color", random:"Random",
    hint:"The number of rounds equals the number of active colors. Disable a colour to reduce the rounds by one: combinations are recalculated, but already completed granny squares stay saved.",
    fAll:"All", fTodo:"To do", fDone:"Completed", perPage:"per page", pageSizeTitle:"Combinations per page",
    counter:(n,total,done)=>`<b>${n}</b> active colours → <b>${n}</b> rounds · <b>${total}</b> combinations · <b>${done}</b> completed`,
    pageOf:(cur,pages,start,end,len)=>`${cur} / ${pages}  ·  page ${start}–${end} of ${len}`,
    doneLabel:"✓ Completed", markDone:"Mark complete",
    emptyActive:"No active colour. Activate at least one colour to see combinations.",
    emptyTooMany:"Too many active colours (max 10) to generate all permutations.",
    doneCount:"completed",
    noneCompleted:"No granny square completed yet.",
    namePlaceholder:"Name",
    toggleTitle:"Enable/disable", delTitle:"Delete", delColor:"Delete this colour? Already completed granny squares with this colour stay saved.",
    newColor:(n)=>"Colour "+n,
    reset:"Reset data", resetTitle:"Reset all (colours and completed)", resetConfirm:"Reset ALL (colours and completed)?",
    cloud:"Cloud", cloudTitle:"Supabase cloud sync",
    cloudTitleModal:"Cloud sync", cloudDesc:"Save colours and completed granny squares to Supabase: they stay permanent and synced across devices. Credentials stay only in this browser.",
    sbUrlLabel:"Project URL", sbKeyLabel:"Publishable / anon key",
    cloudSave:"Connect and sync", cloudTest:"Test only", cloudClear:"Disconnect", cloudClose:"Close",
    cloudCreateLink:"Create a project on supabase.com →",
    cloudConnected:"Connected.", cloudDisconnected:"Disconnected. Data stays saved only in this browser.",
    cloudTesting:"Testing connection…",
    cloudOkFound:"Connection successful (remote state found).", cloudOkEmpty:"Connection successful (empty table: first sync will create the record).",
    cloudFail:"Connection failed. Check URL, anon key and that you ran the SQL script (see instructions).",
    cloudEnter:"Enter URL and anon key.", cloudConnecting:"Connecting…", cloudSyncing:"Syncing…",
    cloudSynced:"Synced. Permanent data, shared across devices.",
    cloudFail2:"Connection failed. Check URL, anon key and that you ran the SQL script.",
  },
};
const t = (k, ...a) => { const v = I18N[LANG][k]; return typeof v === "function" ? v(...a) : v; };
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{ el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll("#langSwitch button").forEach(b=> b.classList.toggle("active", b.dataset.lang===LANG));
}

const state = {
  colors: [],
  done: {},
  filter: "all",
  page: 0,
};

let uid = 1;
function nextId(){ return "c"+(uid++); }

let supa = null;          // supabase client
let supaConnected = false;
let supaRow = null;       // cached remote row
let syncTimer = null;
let syncing = false;      // guard against pull/push recursion

function localLoad(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state.colors = d.colors || [];
      state.done = d.done || {};
      uid = d.uid || (state.colors.reduce((m,c)=>Math.max(m,parseInt((c.id||"c1").slice(1))||1),1)+1);
      return true;
    }
  }catch(e){ console.warn("load failed", e); }
  return false;
}
function localSave(){
  localStorage.setItem(STORE_KEY, JSON.stringify({colors:state.colors, done:state.done, uid}));
}
// ---------- persistence ----------
function load(){
  if(!localLoad()) seed();
}
function save(){
  localSave();
  scheduleCloudPush();
}
function seed(){
  const palette = [
    {name:"Bordeaux", rgb:[150,40,50]},
    {name:"Zafferano", rgb:[214,150,40]},
    {name:"Crema",    rgb:[238,222,188]},
    {name:"Salvia",   rgb:[120,158,110]},
    {name:"Lago",     rgb:[86,128,150]},
    {name:"Prugna",   rgb:[120,78,120]},
  ];
  state.colors = palette.map(p=>({id:nextId(),name:p.name,r:p.rgb[0],g:p.rgb[1],b:p.rgb[2],enabled:true}));
  localSave();
}

// ---------- Supabase ----------
const SB_KEY = "grannySquares.supabase";
const TABLE = "granny_state";
const PK = "id";
const ROW_ID = "single";

function readCreds(){ try{ return JSON.parse(localStorage.getItem(SB_KEY) || "null"); }catch(e){ return null; } }
function writeCreds(c){ if(c) localStorage.setItem(SB_KEY, JSON.stringify(c)); else localStorage.removeItem(SB_KEY); }
function setCloudDot(s){
  const dot=document.getElementById("cloudDot");
  if(!dot) return;
  dot.classList.toggle("on", s==="on"); dot.classList.toggle("err", s==="err");
}
async function connectSupabase(creds){
  if(!window.supabase || !creds || !creds.url || !creds.key) return false;
  try{
    supa = window.supabase.createClient(creds.url, creds.key);
    const { data, error } = await supa.from(TABLE).select("*").eq(PK, ROW_ID).maybeSingle();
    if(error) throw error;
    supaConnected = true; supaRow = data;
    writeCreds(creds); setCloudDot("on");
    return true;
  }catch(e){
    supaConnected=false; supa=null; setCloudDot("err");
    return false;
  }
}
function applyRemote(d){
  if(!d || !d.data) return;
  let r; try{ r = typeof d.data === "string" ? JSON.parse(d.data) : d.data; }catch(e){ return; }
  if(!r || typeof r !== "object") return;
  if(Array.isArray(r.colors)) state.colors = r.colors;
  if(r.done && typeof r.done === "object") state.done = r.done;
  if(typeof r.uid === "number") uid = r.uid;
  localSave();
}
async function cloudPull(){
  if(!supaConnected || !supa) return;
  syncing = true;
  try{
    const { data, error } = await supa.from(TABLE).select("*").eq(PK, ROW_ID).maybeSingle();
    if(error) throw error;
    supaRow = data;
    if(data && data.data){ applyRemote(data); renderColors(); renderCombos(); }
  }catch(e){ console.warn("pull failed", e); setCloudDot("err"); }
  finally{ syncing = false; }
}
async function cloudPush(){
  if(!supaConnected || !supa) return;
  if(syncing) return;
  syncing = true;
  try{
    const payload = { colors: state.colors, done: state.done, uid };
    const body = { [PK]: ROW_ID, data: payload, updated_at: new Date().toISOString() };
    const { data, error } = await supa.from(TABLE).upsert(body).select().maybeSingle();
    if(error) throw error;
    supaRow = data; setCloudDot("on");
  }catch(e){ console.warn("push failed", e); setCloudDot("err"); }
  finally{ syncing = false; }
}
function scheduleCloudPush(){
  if(!supaConnected) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(cloudPush, 800);
}

// ---------- helpers ----------
const active = ()=> state.colors.filter(c=>c.enabled);
const hex = c=>"#"+[c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,"0")).join("");
const fromHex = h=>{ h=h.replace("#",""); return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}; };
const lum = c=>(0.299*c.r+0.587*c.g+0.114*c.b);
const contrast = c=> lum(c)>140 ? "rgba(0,0,0,.62)" : "rgba(255,255,255,.92)";
const keyOf = arr=> arr.map(c=>c.id).join("|");

// ---------- permutations (Heap's algorithm) ----------
function permutations(arr){
  const out=[];
  const n=arr.length;
  if(n===0) return [[]];
  if(n>10){ return null; }
  const a=arr.slice();
  const c=new Array(n).fill(0);
  out.push(a.slice());
  let i=1;
  while(i<n){
    if(c[i]<i){
      if(i%2===0){ [a[0],a[i]]=[a[i],a[0]]; } else { [a[c[i]],a[i]]=[a[i],a[c[i]]]; }
      out.push(a.slice());
      c[i]++; i=1;
    } else { c[i]=0; i++; }
    if(out.length>500000){ return out; }
  }
  return out;
}

// ---------- concentric granny square HTML ----------
// perm[0] = outermost ring (giro 1), last = center.
function grannyHtml(perm, size){
  const n=perm.length;
  if(n===0) return "";
  let inner="";
  for(let k=n-1;k>=0;k--){
    const col=perm[k];
    const side = ((1 - k/n)*100).toFixed(2);
    inner = `<div class="ring" style="width:${side}%;background:${hex(col)}">${inner}</div>`;
  }
  return `<div class="granny" style="max-width:${size}px">${inner}</div>`;
}

// ---------- render colors ----------
function renderColors(){
  const list=document.getElementById("colorList");
  list.innerHTML="";
  state.colors.forEach((c,idx)=>{
    const row=document.createElement("div");
    row.className="color-row";
    row.innerHTML=`
      <label class="swatch" style="background:${hex(c)}">
        <input type="color" value="${hex(c)}" data-i="${idx}" data-act="color">
      </label>
      <div class="cname-wrap">
        <input class="cname" value="${c.name.replace(/"/g,'&quot;')}" data-i="${idx}" data-act="name" placeholder="${t("namePlaceholder")}">
        <span class="crgb">${c.r}, ${c.g}, ${c.b}</span>
      </div>
      <div class="row-actions">
        <div class="toggle ${c.enabled?'on':''}" data-i="${idx}" data-act="toggle" title="${t("toggleTitle")}" style="--tc:${hex(c)}"></div>
        <button class="btn sm" data-i="${idx}" data-act="del" title="${t("delTitle")}">✕</button>
      </div>`;
    list.appendChild(row);
  });
}

// ---------- render combinations ----------
let allCombos=null;
function renderCombos(){
  const grid=document.getElementById("grid");
  const pager=document.getElementById("pager");
  const counter=document.getElementById("counter");
  const A=active();
  const n=A.length;

  if(n===0 && state.filter!=="done"){
    allCombos=null;
    grid.innerHTML=`<div class="empty">${t("emptyActive")}</div>`;
    pager.innerHTML="";
    counter.textContent="";
    return;
  }
  if(n===0){ // filter==="done" with no active colours: still show saved ones
    allCombos=null;
  }

  if(n>0){
    allCombos=permutations(A);
    if(allCombos===null){
      grid.innerHTML=`<div class="empty">${t("emptyTooMany")}</div>`;
      pager.innerHTML=""; counter.textContent="";
      return;
    }
  } else {
    allCombos=[];
  }

  const byId=new Map(state.colors.map(c=>[c.id,c]));
  const savedDone = Object.keys(state.done).map(key=>{
    const ids=key.split("|");
    return ids.map(id=>byId.get(id)).filter(Boolean);
  }).filter(arr=>arr.length>0);

  let combos;
  if(state.filter==="done"){
    combos = savedDone;
    if(combos.length===0){
      grid.innerHTML=`<div class="empty">${t("noneCompleted")}</div>`;
      pager.innerHTML="";
      counter.innerHTML=`<b>0</b> ${t("doneCount")}`;
      return;
    }
  } else if(state.filter=="todo"){
    combos = allCombos.filter(p=>!state.done[keyOf(p)]);
  } else {
    combos = allCombos;
  }

  const total=allCombos.length;
  const doneCount=savedDone.length;
  const loc = LANG==="it"?"it-IT":"en-US";
  if(state.filter=="done"){
    counter.innerHTML = `<b>${doneCount}</b> ${t("doneCount")}`;
  } else {
    counter.innerHTML=t("counter", n, total.toLocaleString(loc), doneCount);
  }

  const pages=Math.ceil(combos.length/PAGE_SIZE)||1;
  if(state.page>=pages) state.page=pages-1;
  if(state.page<0) state.page=0;
  const start=state.page*PAGE_SIZE;
  const slice=combos.slice(start,start+PAGE_SIZE);

  const ringSize = n<=4?150: n<=6?140:128;

  grid.innerHTML="";
  const frag=document.createDocumentFragment();
  slice.forEach(perm=>{
    const key=keyOf(perm);
    const isDone=!!state.done[key];
    const size = perm.length<=4?150: perm.length<=6?140:128;
    const sq=document.createElement("div");
    sq.className="square"+(isDone?" done":"");
    sq.dataset.key=key;
    sq.innerHTML=
      grannyHtml(perm, size) +
      `<div class="label">${isDone?t("doneLabel"):t("markDone")}</div>` +
      `<div class="badge">✓</div>`;
    sq.addEventListener("click",()=>{
      if(state.done[key]) delete state.done[key]; else state.done[key]=true;
      save();
      renderCombos();
    });
    frag.appendChild(sq);
  });
  grid.appendChild(frag);

  pager.innerHTML="";
  if(pages>1){
    const prev=document.createElement("button");
    prev.className="btn sm"; prev.textContent="‹"; prev.disabled=state.page===0;
    prev.onclick=()=>{state.page--;renderCombos();};
    pager.appendChild(prev);
    const info=document.createElement("span");
    info.className="info";
    info.textContent=t("pageOf", state.page+1, pages, start+1, Math.min(start+PAGE_SIZE,combos.length), combos.length);
    pager.appendChild(info);
    const next=document.createElement("button");
    next.className="btn sm"; next.textContent="›"; next.disabled=state.page===pages-1;
    next.onclick=()=>{state.page++;renderCombos();};
    pager.appendChild(next);
  }
}

// ---------- events ----------
document.getElementById("colorList").addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const i=+el.dataset.i;
  const act=el.dataset.act;
  if(act=="toggle"){
    state.colors[i].enabled=!state.colors[i].enabled;
    save(); renderColors(); state.page=0; renderCombos();
  } else if(act=="del"){
    if(!confirm(t("delColor"))) return;
    state.colors.splice(i,1);
    save(); renderColors(); state.page=0; renderCombos();
  }
});

document.getElementById("colorList").addEventListener("input",e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const i=+el.dataset.i;
  if(el.dataset.act=="color"){
    const {r,g,b}=fromHex(el.value);
    Object.assign(state.colors[i],{r,g,b});
    el.closest(".swatch").style.background=el.value;
    const rgb=el.closest(".color-row").querySelector(".crgb");
    rgb.textContent=`${r}, ${g}, ${b}`;
    save(); renderCombos();
  } else if(el.dataset.act=="name"){
    state.colors[i].name=el.value;
    save();
  }
});

document.getElementById("addBtn").addEventListener("click",()=>{
  state.colors.push({id:nextId(),name:t("newColor",(state.colors.length+1)),r:130,g:120,b:110,enabled:true});
  save(); renderColors(); state.page=0; renderCombos();
});
document.getElementById("randomBtn").addEventListener("click",()=>{
  if(state.colors.length===0) return;
  const last=state.colors[state.colors.length-1];
  last.r=Math.floor(Math.random()*256); last.g=Math.floor(Math.random()*256); last.b=Math.floor(Math.random()*256);
  save(); renderColors(); renderCombos();
});
document.querySelectorAll(".filter").forEach(b=>{
  b.addEventListener("click",()=>{
    state.filter=b.dataset.f;
    document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));
    state.page=0; renderCombos();
  });
});
document.getElementById("pageSize").addEventListener("change",e=>{
  PAGE_SIZE=+e.target.value;
  state.page=0; renderCombos();
});
function resetBtnHandler(){
  if(!confirm(t("resetConfirm"))) return;
  localStorage.removeItem(STORE_KEY);
  state.colors=[]; state.done={}; uid=1; seed();
  state.page=0; state.filter="all";
  document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.f==="all"));
  renderColors(); renderCombos();
}
document.getElementById("resetBtn").addEventListener("click",resetBtnHandler);

// ---------- cloud modal ----------
function cloudStatus(msg, kind){
  const s=document.getElementById("cloudStatus");
  s.textContent=msg||""; s.className="status"+(kind?" "+kind:"");
}
document.getElementById("cloudBtn").addEventListener("click",()=>{
  const c=readCreds();
  if(c){ document.getElementById("sbUrl").value=c.url; document.getElementById("sbKey").value=c.key; }
  cloudStatus(supaConnected?t("cloudConnected"):"", supaConnected?"ok":"");
  document.getElementById("cloudOverlay").classList.add("show");
});
document.getElementById("cloudClose").addEventListener("click",()=>{
  document.getElementById("cloudOverlay").classList.remove("show");
});
document.getElementById("cloudOverlay").addEventListener("click",e=>{
  if(e.target.id=="cloudOverlay") document.getElementById("cloudOverlay").classList.remove("show");
});
document.getElementById("cloudClear").addEventListener("click",()=>{
  writeCreds(null); supa=null; supaConnected=false; supaRow=null; setCloudDot("");
  cloudStatus(t("cloudDisconnected"), "");
});
document.getElementById("cloudTest").addEventListener("click",async()=>{
  const url=document.getElementById("sbUrl").value.trim();
  const key=document.getElementById("sbKey").value.trim();
  cloudStatus(t("cloudTesting"), "");
  const ok=await connectSupabase({url,key});
  if(ok){
    cloudStatus(supaRow && supaRow.data ? t("cloudOkFound") : t("cloudOkEmpty"), "ok");
  } else {
    cloudStatus(t("cloudFail"), "err");
  }
});
document.getElementById("cloudSave").addEventListener("click",async()=>{
  const url=document.getElementById("sbUrl").value.trim();
  const key=document.getElementById("sbKey").value.trim();
  if(!url||!key){ cloudStatus(t("cloudEnter"), "err"); return; }
  cloudStatus(t("cloudConnecting"), "");
  const ok=await connectSupabase({url,key});
  if(!ok){ cloudStatus(t("cloudFail2"), "err"); return; }
  cloudStatus(t("cloudSyncing"), "");
  await cloudPull();
  await cloudPush();
  cloudStatus(t("cloudSynced"), "ok");
  renderColors(); renderCombos();
  setTimeout(()=>document.getElementById("cloudOverlay").classList.remove("show"), 900);
});

// ---------- init ----------
applyLang();
load();
document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.f=="all"));
renderColors();
renderCombos();
document.getElementById("langSwitch").addEventListener("click",e=>{
  const b=e.target.closest("button[data-lang]");
  if(!b) return;
  LANG=b.dataset.lang;
  localStorage.setItem(LANG_KEY, LANG);
  applyLang();
  renderColors(); renderCombos();
});
(async()=>{
  const c=readCreds();
  if(c){
    const ok=await connectSupabase(c);
    if(ok){ await cloudPull(); renderColors(); renderCombos(); }
  }
})();
</script>
