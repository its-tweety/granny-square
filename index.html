<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granny Square</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header>
  <div>
    <h1><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5" stroke="#a8543a" stroke-width="2.2"/><rect x="6" y="6" width="12" height="12" rx="3.5" stroke="#b08a4a" stroke-width="2.2"/><circle cx="12" cy="12" r="2.6" fill="#5f7a4e"/></svg></span> Granny Square</h1>
  </div>
  <div class="row-actions">
    <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
      <button type="button" data-lang="it">IT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div class="pill">
      <button class="btn sm" id="exportBtn" data-i18n="export" data-i18n-title="exportTitle"></button>
      <button class="btn sm" id="importBtn" data-i18n="import" data-i18n-title="importTitle"></button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    <button class="btn" id="resetBtn" data-i18n="reset" data-i18n-title="resetTitle"></button>
  </div>
</header>

<main>
  <section class="panel" id="leftPanel">
    <h2 data-i18n="colors"></h2>
    <div id="colorList"></div>
    <div class="add-color row-actions">
      <button class="btn primary sm" id="addBtn" data-i18n="addColor"></button>
    </div>
    <p class="hint" data-i18n="hint"></p>
  </section>

  <section class="panel">
    <div class="stats">
      <div id="counter"></div>
      <div class="controls">
        <div class="filters">
          <button class="btn sm filter" data-f="all" data-i18n="fAll"></button>
          <button class="btn sm filter" data-f="todo" data-i18n="fTodo"></button>
          <button class="btn sm filter" data-f="done" data-i18n="fDone"></button>
        </div>
        <span class="plabel" data-i18n="perPage"></span>
        <select class="psize" id="pageSize" data-i18n-title="pageSizeTitle">
          <option value="24">24</option>
          <option value="48">48</option>
          <option value="120" selected>120</option>
          <option value="240">240</option>
          <option value="500">500</option>
        </select>
      </div>
    </div>
    <div id="comboWrap">
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>
</main>

<script src="assets/js/app.js" defer></script>
</body>
</html>
